# Smart Factory - development infrastructure
# PostgreSQL + Mosquitto run in Docker; backend and frontend run natively (hot reload).
# Production compose (mosquitto, postgres, backend, frontend, nginx) is added in Phase 8.

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-factory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sf_password}
      POSTGRES_DB: ${POSTGRES_DB:-smart_factory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sf_user} -d ${POSTGRES_DB:-smart_factory}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smart-factory-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-factory-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u backend -P '${MQTT_PASSWORD:-SmartFactory@123}' -t '$$SYS/broker/uptime' -C 1 -W 15 > /dev/null 2>&1"]
      interval: 15s
      timeout: 18s
      retries: 5
      start_period: 15s
    networks:
      - smart-factory-net

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:

networks:
  smart-factory-net:
    driver: bridge
