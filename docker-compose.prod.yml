# Smart Factory - production stack
# Services: mosquitto, postgres, backend, frontend, nginx
# Usage:
#   cp .env.production.example .env.production
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Only nginx is exposed to the host (NGINX_PORT).

name: smart-factory-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-factory-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sf_password}
      POSTGRES_DB: ${POSTGRES_DB:-smart_factory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sf_user} -d ${POSTGRES_DB:-smart_factory}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smart-factory-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-factory-prod-mosquitto
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u backend -P '${MQTT_PASSWORD:-SmartFactory@123}' -t '$$SYS/broker/uptime' -C 1 -W 15 > /dev/null 2>&1"]
      interval: 15s
      timeout: 18s
      retries: 5
      start_period: 15s
    networks:
      - smart-factory-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-factory-prod-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      MQTT_URL: ${MQTT_URL:-mqtt://mosquitto:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-SmartFactory@123}
      MQTT_OFFLINE_THRESHOLD_MINUTES: ${MQTT_OFFLINE_THRESHOLD_MINUTES:-5}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smart-factory-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-/}
    container_name: smart-factory-prod-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smart-factory-net

  nginx:
    image: nginx:1.27-alpine
    container_name: smart-factory-prod-nginx
    restart: unless-stopped
    # Remove the stock default.conf (it claims server_name localhost and
    # shadows our config when accessed via Host: localhost).
    command: ["/bin/sh", "-c", "rm -f /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Empty by default; scripts/issue-cert.sh writes the HTTPS config here.
      - ./docker/nginx/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      # Let's Encrypt certificates (host certbot writes to /etc/letsencrypt).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot for ACME challenges (certbot --webroot -w ./certbot-www).
      - ./certbot-www:/var/www/certbot
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/nginx-health > /dev/null 2>&1 || wget -qO- http://127.0.0.1/nginx-health > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smart-factory-net

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:

networks:
  smart-factory-net:
    driver: bridge
