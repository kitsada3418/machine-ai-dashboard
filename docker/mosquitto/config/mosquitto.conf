# Mosquitto configuration - Smart Factory MQTT Broker
# Machine controllers authenticate with per-machine credentials (machine_Mxxx)
# and may only publish to their own topics (see acl).

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice


listener 1883

# Security: username/password + ACL (generated by docker/mosquitto/scripts)
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

